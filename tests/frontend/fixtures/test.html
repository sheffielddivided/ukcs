<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UKCS frontend test harness</title>
  <!--
    Test-only harness HTML. Deliberately NOT a copy of docs/index.html's
    full markup - it carries only the element IDs docs/app/main.js
    actually looks up (kept in sync by hand; see
    tests/frontend/test_equity_frontend.py). It loads the real, committed
    docs/app/*.js modules unmodified - only the maplibre-gl CDN import is
    intercepted (tests/frontend/conftest.py) and echarts is pre-stubbed
    via add_init_script, so this exercises production application code
    against fixture data, not a reimplementation of it. No maplibre-gl.css
    link here (styling is irrelevant to these tests, and the real link tag
    carries a pinned SRI hash that a stub stylesheet could never satisfy).
  -->
</head>
<body>
  <header>
    <h1>UKCS Oil &amp; Gas Production Explorer</h1>
    <a href="./methodology.html" class="header-methodology-link">Methodology</a>
  </header>

  <div id="status-banner" hidden></div>
  <div id="equity-status-banner" hidden></div>

  <div id="layout">
    <aside id="sidebar">
      <div class="search-box">
        <label for="global-search">Search fields, legal entities, operators</label>
        <input
          type="text"
          id="global-search"
          role="combobox"
          aria-expanded="false"
          aria-controls="global-search-results"
          aria-autocomplete="list"
          autocomplete="off"
        />
        <ul id="global-search-results" class="search-results" role="listbox" hidden></ul>
      </div>

      <div class="metric-mode-toggle" role="group" aria-label="Company production metric">
        <button type="button" id="mode-equity" class="mode-button" aria-pressed="true">Equity-attributable production</button>
        <button type="button" id="mode-operator" class="mode-button" aria-pressed="false">Operator production</button>
      </div>

      <div id="equity-mode-controls">
        <label for="equity-company-input">Legal entity as recorded by NSTA</label>
        <input type="text" id="equity-company-input" list="equity-company-list" autocomplete="off" />
        <datalist id="equity-company-list"></datalist>
      </div>

      <div id="operator-mode-controls">
        <label for="operator-filter">Filter map by operator</label>
        <select id="operator-filter"></select>
        <button id="view-operator-history" type="button" disabled hidden>View operator production history</button>
      </div>

      <div id="layer-toggles">
        <label><input type="checkbox" id="layer-toggle-bubbles" checked /> Production bubbles</label>
        <label><input type="checkbox" id="layer-toggle-outlines" checked /> Field outlines</label>
      </div>
    </aside>

    <div id="map-container">
      <div id="map"></div>
    </div>

    <aside id="field-panel" hidden>
      <button id="field-panel-close" type="button" aria-label="Close">&times;</button>
      <div id="field-panel-content"></div>
    </aside>
  </div>

  <footer>
    <div id="footer-text">Loading&hellip;</div>
  </footer>

  <script type="module" src="./app/main.js"></script>
</body>
</html>
