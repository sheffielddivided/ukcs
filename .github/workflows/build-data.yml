name: Build data

# Weekly scheduled rebuild of docs/data/*, plus manual trigger. See spec
# section 11 / 13 step 8. PPRS is monthly; the schedule is weekly per
# spec so a delayed NSTA release is picked up within days, not a month.
#
# Every check in etl/validate.py runs BEFORE any file under docs/data/ is
# written (etl/build.py's own atomic-write discipline - see its
# docstring), so a validation failure here always means: red job, zero
# commits, docs/data/ untouched. There is no partial-write path to guard
# against separately.
#
# Sequence: checkout -> install deps -> run tests -> run build -> detect
# substantive changes -> commit if needed. Tests run BEFORE the build
# fetches anything, and a failing test stops the job (no continue-on-error
# anywhere in this file), so the build step never runs against a suite
# that's already red - closing the Phase 1 audit gap where 27+ committed
# tests existed but nothing in CI ever executed them.
on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday ~04:17 UTC (off the hour, avoids GH Actions' documented top-of-hour congestion)
  workflow_dispatch: {}

permissions:
  contents: write

# Only one build run at a time; a scheduled run overlapping a manual
# workflow_dispatch (or a slow previous run still finishing) must not
# race to commit docs/data/ concurrently. Do not cancel an in-flight
# build just because another was requested - let it finish or fail
# cleanly, then the next run starts from a clean, known state.
concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous but bounded: a real build takes under a minute locally.
    # This is the outer safety net against a hung request that the
    # per-request 30s timeout in etl/arcgis.py somehow doesn't catch (a
    # TCP-level hang, or an unbounded retry/pagination loop) - it exists
    # so a stuck run fails and frees the Actions minutes budget rather
    # than running until GitHub's own hard 6-hour ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # tests/requirements.txt pulls in etl/requirements.txt (-r) plus
        # pytest, so this one install covers both the build and the test
        # suite - no separate install step needed for tests.
        run: pip install -r tests/requirements.txt

      - name: Run tests
        # No network calls in the test suite (see tests/test_*.py
        # docstrings) - this is fast and deterministic, never flaky on
        # live-service availability. A failing test stops the job here;
        # "Run build" below never executes against a red suite.
        #
        # tests/frontend is excluded here: it needs Playwright + a
        # Chromium download (tests/frontend/requirements.txt), which this
        # job's dependency install does not include, and it is a
        # different concern (docs/app/*.js) from this ETL build. It runs
        # in its own workflow, frontend-tests.yml.
        run: pytest tests/ --ignore=tests/frontend -v

      - name: Run build
        run: python etl/build.py

      - name: Upload raw equity workbook
        # spec section 15.2: keep the raw workbook traceable for at least
        # 90 days so a disputed equity number can be traced to the exact
        # input file, independent of git history (etl/.cache/ is
        # gitignored, never committed).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equity-workbook-${{ github.run_id }}
          path: etl/.cache/equity_workbook.xlsx
          retention-days: 90
          if-no-files-found: ignore

      - name: Check for a substantive data change
        id: changes
        # meta.json's built_at changes on every successful build even
        # when no upstream data changed (see etl/build.py), so a plain
        # `git diff --quiet -- docs/data` would never be quiet and every
        # run would produce an empty-content commit. Check every OTHER
        # artifact first; if none of them changed, the only difference is
        # built_at, so revert it and skip the commit entirely. This exact
        # logic was verified locally against two consecutive real builds
        # with unchanged upstream data before being put here - see the
        # step 8 build report.
        #
        # PPRS and equity are independent upstream sources (equity is
        # updated weekly by NSTA independently of PPRS - spec section
        # 15.2), so each is diffed separately: a substantive change in
        # either is enough to trigger a commit, and the commit message
        # names which source(s) actually changed rather than always
        # saying "NSTA refresh".
        run: |
          PPRS_CHANGED=false
          EQUITY_CHANGED=false
          OVERVIEW_CHANGED=false
          if ! git diff --quiet -- docs/data/fields.geojson docs/data/history docs/data/operators.json docs/data/operators; then
            PPRS_CHANGED=true
          fi
          if ! git diff --quiet -- docs/data/equity; then
            EQUITY_CHANGED=true
          fi
          # docs/data/overview/* is entirely DERIVED from the PPRS/equity
          # data already covered above, so normally a change there
          # implies PPRS_CHANGED or EQUITY_CHANGED is already true - EXCEPT
          # when an ETL code change (not an upstream data change) adds a
          # brand-new derived artifact file, which `git diff` never
          # reports at all regardless of path filters (it only ever sees
          # CONTENT changes to already-tracked files, never a new
          # untracked one). `git status --porcelain` does report new
          # files, so it's used here specifically to catch that case -
          # docs/data/overview/meta.json's own built_at is excluded from
          # this check the same way the top-level meta.json's is reverted
          # below, since it changes on every run regardless of whether
          # anything else in overview/ actually changed.
          overview_status="$(git status --porcelain -- docs/data/overview | grep -v 'docs/data/overview/meta\.json$' || true)"
          if [ -n "$overview_status" ]; then
            OVERVIEW_CHANGED=true
          fi
          echo "pprs_changed=$PPRS_CHANGED" >> "$GITHUB_OUTPUT"
          echo "equity_changed=$EQUITY_CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$PPRS_CHANGED" = false ] && [ "$EQUITY_CHANGED" = false ] && [ "$OVERVIEW_CHANGED" = false ]; then
            echo "No substantive data change (only built_at would differ) - reverting meta.json, skipping commit."
            git checkout -- docs/data/meta.json docs/data/overview/meta.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          LATEST_PERIOD=$(python3 -c "import json; print(json.load(open('docs/data/meta.json'))['latest_period'])")
          if [ "${{ steps.changes.outputs.pprs_changed }}" = "true" ] && [ "${{ steps.changes.outputs.equity_changed }}" = "true" ]; then
            MSG="data: refresh NSTA PPRS and equity shares (period ${LATEST_PERIOD})"
          elif [ "${{ steps.changes.outputs.equity_changed }}" = "true" ]; then
            MSG="data: refresh NSTA equity shares"
          else
            MSG="data: NSTA refresh, period ${LATEST_PERIOD}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "$MSG"
          git push
